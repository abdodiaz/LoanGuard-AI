<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>LoanGuard - Admin</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; margin: 0; }
        nav { background: #1e293b; padding: 15px; display: flex; justify-content: space-around; }
        nav a { color: white; text-decoration: none; }
        .container { max-width: 900px; margin: 40px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { color: #1e293b; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #f1f5f9; }
        th { background: #f8fafc; color: #64748b; text-transform: uppercase; font-size: 12px; }
        .btn-delete { background: #fee2e2; color: #991b1b; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .btn-delete:hover { background: #fecaca; }
    </style>
</head>
<body onload="loadUsers()">
    <nav>
        <a href="/static/predict.html">Prédiction</a>
        <a href="/static/history.html">Historique</a>
        <a href="/static/admin.html"><strong>Admin Panel</strong></a>
        <a href="#" onclick="logout()">Déconnexion</a>
    </nav>

    <div class="container">
        <h2>Gestion des Utilisateurs</h2>
        <table id="userTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Email</th>
                    <th>Rôle</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        const token = localStorage.getItem('token');

        async function loadUsers() {
            const res = await fetch('/admin/users', { 
                headers: { 'Authorization': 'Bearer ' + token } 
            });
            
            if (res.status === 403) {
                alert("Accès refusé : Vous n'êtes pas administrateur.");
                window.location.href = '/static/predict.html';
                return;
            }

            const users = await res.json();
            const tbody = document.querySelector('#userTable tbody');
            tbody.innerHTML = '';

            users.forEach(user => {
                tbody.innerHTML += `
                    <tr>
                        <td>${user.id}</td>
                        <td>${user.email}</td>
                        <td>${user.role}</td>
                        <td>
                            <button class="btn-delete" onclick="deleteUser(${user.id})">Supprimer</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function deleteUser(id) {
            if (confirm("Supprimer cet utilisateur ?")) {
                const res = await fetch(`/admin/users/${id}`, { 
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (res.ok) loadUsers();
                else alert("Erreur lors de la suppression");
            }
        }

        function logout() { localStorage.removeItem('token'); window.location.href = '/static/login.html'; }
    </script>
</body>
</html>
